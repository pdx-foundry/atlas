[package]
name = "pdx-atlas"
version = "0.1.0"
edition = "2024"

[dependencies]
pdx-native = { git = "https://github.com/pdx-foundry/native.git", rev = "ee01bf338872290eaaab2ca3c0503fc33244686e" }
pdxscript = { git = "https://github.com/pdx-foundry/pdxscript-rs.git", rev = "259170dd1e52a74bec2b955c67ced4ca8a751881" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
jsonschema = { version = "0.56", default-features = false }
tempfile = "3"
